spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  role: api
  api-key: test-api-key-test-environment-123456
  worker:
    id: test-worker-1
    batch-size: 10
    poll-interval-ms: 100
    lease-seconds: 5
    concurrency: 4
  delivery:
    base-backoff-seconds: 1
    max-backoff-seconds: 5
    max-attempts: 3
    http-timeout-ms: 2000
